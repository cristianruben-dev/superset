<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="<%= require('../images/favicon.png')%>"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f8fa;
        --card: #ffffff;
        --border: #e4e4e9;
        --text: #0a0a0f;
        --muted: #55555f;
        --primary: #5b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --card: #111114;
          --border: #27272d;
          --text: #f4f4f6;
          --muted: #a1a1ab;
          --primary: #8b8df7;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          Geist,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 48px;
        max-width: 480px;
        text-align: center;
        box-shadow:
          0 1px 2px rgba(10, 10, 15, 0.04),
          0 8px 24px -12px rgba(10, 10, 15, 0.1);
      }
      .logo {
        width: 48px;
        height: 48px;
      }
      .code {
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        margin: 24px 0 8px;
        color: var(--primary);
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .button {
        background: var(--primary);
        border-radius: 8px;
        color: #fff;
        display: inline-block;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 24px;
        text-decoration: none;
      }
    </style>

    <title>500: Error del servidor | Mi BI</title>
  </head>

  <body>
    <main class="card">
      <img
        class="logo"
        alt="Mi BI"
        src="<%= require('../images/favicon.png')%>"
      />
      <div class="code">500</div>
      <h1>Algo salió mal</h1>
      <p>
        Ocurrió un error inesperado en el servidor. Inténtalo de nuevo en unos
        minutos o vuelve al inicio.
      </p>
      <a href="/" class="button">Volver al inicio</a>
    </main>
  </body>
</html>
