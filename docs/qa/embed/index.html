<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prueba de embebido</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f3f4f6; color: #111827; }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
    header strong { font-size: 15px; }
    header code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    #status { margin-left: auto; color: #6b7280; }
    main { padding: 16px; }
    #frame { background: #fff; border: 1px dashed #9ca3af; border-radius: 8px; overflow: hidden; margin: 0 auto; }
    #frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .err { color: #b91c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <strong>Sitio del cliente</strong>
    <span>dashboard <code id="uuid-label">?</code></span>
    <span id="opts"></span>
    <span id="status">cargando…</span>
  </header>
  <main>
    <div id="frame"></div>
    <pre id="error" class="err"></pre>
  </main>
  <script src="https://unpkg.com/@superset-ui/embedded-sdk@0.4.0/bundle/index.js"></script>
  <script>
    // Query params: uuid (embedded id, required), superset (base URL), w, h (frame size, px),
    // title=1 shows the dashboard title, tabs=1 shows tabs, controls=1 shows chart controls,
    // filters=0 hides the filter bar, expanded=1 expands it, rls=<clause> (repeatable),
    // user=<username>, debug=1, native_filters=<superset url param value>.
    const q = new URLSearchParams(location.search);
    const uuid = q.get('uuid');
    const supersetDomain = q.get('superset') || 'http://localhost:8188';
    const w = q.get('w');
    const h = q.get('h') || '720';
    const frame = document.getElementById('frame');
    frame.style.height = h + 'px';
    if (w) frame.style.width = w + 'px';
    document.getElementById('uuid-label').textContent = uuid || '(falta ?uuid=)';
    const flag = (k) => q.get(k) === '1';
    const uiConfig = {
      hideTitle: !flag('title'),
      hideTab: !flag('tabs'),
      hideChartControls: !flag('controls'),
      filters: { visible: q.get('filters') !== '0', expanded: flag('expanded') },
    };
    const urlParams = {};
    for (const [k, v] of q.entries()) {
      if (k.startsWith('p_')) urlParams[k.slice(2)] = v;
    }
    if (Object.keys(urlParams).length) uiConfig.urlParams = urlParams;
    document.getElementById('opts').textContent = JSON.stringify(uiConfig);
    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    let tokens = 0;

    async function fetchGuestToken() {
      const params = new URLSearchParams({ uuid, user: q.get('user') || 'invitado' });
      for (const clause of q.getAll('rls')) params.append('rls', clause);
      const res = await fetch('/guest-token?' + params.toString());
      const body = await res.json();
      if (!res.ok || !body.token) {
        throw new Error('guest token: ' + JSON.stringify(body));
      }
      tokens += 1;
      status.textContent = `token #${tokens} emitido ${new Date().toLocaleTimeString()}`;
      return body.token;
    }

    if (uuid) {
      supersetEmbeddedSdk
        .embedDashboard({
          id: uuid,
          supersetDomain,
          mountPoint: frame,
          fetchGuestToken,
          dashboardUiConfig: uiConfig,
          debug: flag('debug'),
        })
        .then(dash => { window.embedded = dash; })
        .catch(err => { errorBox.textContent = String(err && err.stack || err); status.textContent = 'error'; });
    }
  </script>
</body>
</html>
