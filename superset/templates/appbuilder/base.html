{% extends base_template %}

{% block head_css %}
    {{ super() }}
    <style>
    /* Mobile UI fixes for Flask-AppBuilder legacy pages on phones (<= 767px) */
    @media (max-width: 767px) {
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        .container {
            width: 100% !important;
            max-width: 100% !important;
            padding-left: 15px;
            padding-right: 15px;
            box-sizing: border-box;
        }

        .panel {
            max-width: 100%;
        }

        .panel-body {
            max-width: 100%;
        }

        /* 1. Tables: responsive container with overflow-x: auto scrolling inside itself */
        .table-responsive {
            display: block;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 15px;
        }

        /* Roles "Permisos" column max-width and content wrapping */
        .table-responsive > .table > tbody > tr > td.col-permissions,
        .table-responsive > .table > thead > tr > th.col-permissions,
        td.col-permissions,
        th.col-permissions {
            max-width: 260px;
            min-width: 160px;
            white-space: normal !important;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* 2. Action icons and checkboxes: at least 24 px on phones */
        input[type="checkbox"].action_check,
        input[type="checkbox"].action_check_all,
        .action_checkboxes input[type="checkbox"],
        td.col-action-checkbox input[type="checkbox"],
        td > input[type="checkbox"] {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            cursor: pointer;
            margin: 0;
            vertical-align: middle;
        }

        th.action_checkboxes,
        td.col-action-checkbox {
            min-width: 36px;
            text-align: center;
            vertical-align: middle;
        }

        .btn-group-xs > .btn,
        .btn-xs,
        .table td .btn-group > .btn {
            min-width: 28px;
            min-height: 28px;
            padding: 4px 6px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .btn-group-xs > .btn i.fa,
        .btn-xs i.fa,
        .table td .btn-group > .btn i.fa {
            font-size: 14px;
            line-height: 1;
        }

        /* 3. Search dropdown ("Buscar" button) and add/back buttons: at least 40 px height */
        #accordion1 .panel-heading,
        .panel-group .panel-heading {
            padding: 0;
            min-height: 40px;
        }

        #accordion1 .panel-title,
        .panel-group .panel-title {
            margin: 0;
        }

        #accordion1 a.accordion-toggle,
        .panel-group a.accordion-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 40px;
            padding: 10px 15px;
            font-size: 14px;
            box-sizing: border-box;
            text-decoration: none;
        }

        .form-search button[type="submit"],
        .form-search .btn-group > button.dropdown-toggle,
        #filter_form button[type="submit"],
        #filter_form .btn-group > button.dropdown-toggle {
            min-height: 40px;
            min-width: 40px;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .well {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        .well .pull-right {
            float: none !important;
            margin-left: auto;
            width: 100%;
            margin-top: 4px;
        }

        .well .pagination {
            margin: 0;
        }

        .well .btn,
        .well a.btn,
        a.btn[href$="/add"],
        a.btn[href*="/add?"],
        a.btn[href*="back"],
        a.btn[title*="Add"],
        a.btn[title*="Añadir"],
        a.btn[title*="Agregar"],
        a.btn[title*="Back"],
        a.btn[title*="Volver"] {
            min-height: 40px;
            min-width: 40px;
            padding: 8px 14px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .well a.btn i.fa,
        a.btn[href$="/add"] i.fa,
        a.btn[href*="back"] i.fa {
            font-size: 16px;
        }
    }
    </style>
{% endblock %}
