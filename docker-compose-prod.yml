# AuraData BI production stack.
#
#   cp docker/.env-prod.example docker/.env-prod   # then fill in the secrets
#   docker compose -f docker-compose-prod.yml up -d --build
#
# Add `--profile mcp` to also start the MCP service for AI agents.
# Put a reverse proxy with TLS (nginx, Traefik, Caddy...) in front of port 8088.

x-mibi-image: &mibi-image
  image: ${MIBI_IMAGE:-mibi:latest}
  build:
    context: .
    target: prod
    args:
      INCLUDE_CHROMIUM: ${INCLUDE_CHROMIUM:-false}
  env_file:
    - path: docker/.env-prod
      required: true
  restart: unless-stopped
  volumes:
    - superset_home:/app/superset_home

x-mibi-depends: &mibi-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  superset-init:
    condition: service_completed_successfully

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: docker/.env-prod
        required: true
    volumes:
      - db_home:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  superset-init:
    <<: *mibi-image
    command: ["/app/docker/mibi/docker-init-prod.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *mibi-image
    command: ["/app/docker/entrypoints/run-server.sh"]
    environment:
      SERVER_WORKER_AMOUNT: ${SERVER_WORKER_AMOUNT:-4}
    ports:
      - "${MIBI_PORT:-8088}:8088"
    depends_on: *mibi-depends

  superset-worker:
    <<: *mibi-image
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on: *mibi-depends

  superset-worker-beat:
    <<: *mibi-image
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    healthcheck:
      disable: true
    depends_on: *mibi-depends

  superset-mcp:
    <<: *mibi-image
    profiles: ["mcp"]
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:${MCP_PORT:-5008}:5008"
    depends_on: *mibi-depends

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
